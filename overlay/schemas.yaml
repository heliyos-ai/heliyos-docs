operations:
  listBaseSchemas:
    summary: List objects
    description: |
      Returns every object (base schema) in the workspace that you may view, with its fields, oldest
      first: companies, people, each deal pipeline and your custom objects. The list is not paginated;
      a workspace has a handful of objects.

      Use it to find an object's `id` (records call it `schemaId`) and its field keys. Fields whose
      permissions hide them from you are left out of each object.
    parameters:
      isRecordCount:
        description: >-
          true adds `recordCount` (the number of records) to each object. Counting takes longer on
          large workspaces. Defaults to false.
        example: true
    response:
      description: All objects you may view.
      message: Schemas retrieved successfully
      data:
        type: array
        items: { $ref: "#/components/schemas/SchemaObject" }
      example:
        - id: 66a0f1e2d3c4b5a697880001
          organizationId: 66a0f1e2d3c4b5a697887766
          name: Company
          slug: company
          description: Master data for companies
          type: base
          objectType: company
          viewType: table
          fields:
            - id: 674af8e0017b924c5d1d69b2
              sequence: 1
              name: company_name
              displayName: Company
              type: { type: relationship, enum: [relationship, text] }
              required: true
              isAIEnabled: false
              isHiddenField: false
              permissions: *examplePermissions
              hasAccess: true
          permissions: *examplePermissions
          recordCount: 412
          created: { at: "2026-01-12T08:00:00.000Z", by: system }
          updated: { at: "2026-10-02T14:21:00.000Z", by: 66a0f1e2d3c4b5a697881111 }
        - id: 6730b1c4d3e5f6a7b8c9d0e1
          organizationId: 66a0f1e2d3c4b5a697887766
          name: Partners
          slug: partners
          type: custom
          objectType: partners
          viewType: table
          fields:
            - id: 6730c2d5e4f6a7b8c9d0e1f2
              sequence: 4
              name: partner_tier
              displayName: Partner tier
              type: { type: select, enum: [select] }
              settings: { selectOptions: [{ value: Gold, color: amber }, { value: Silver, color: gray }] }
              required: false
              isAIEnabled: false
              isHiddenField: false
              permissions: *examplePermissions
              hasAccess: true
          permissions: *examplePermissions
          recordCount: 18
          created: { at: "2026-11-04T09:30:00.000Z", by: 66a0f1e2d3c4b5a697881111 }
          updated: { at: "2026-11-04T09:30:00.000Z", by: 66a0f1e2d3c4b5a697881111 }

  getBaseSchema:
    summary: Get an object
    description: |
      Returns one object (base schema) with its fields. Fields whose permissions hide them from you
      are left out.

      This response names the object's id `_id`, where list, create and update name it `id`.
    parameters:
      id:
        description: The object's id.
        example: 6730b1c4d3e5f6a7b8c9d0e1
    response:
      description: The object.
      message: Base schema retrieved successfully
      data: { $ref: "#/components/schemas/SchemaObject" }
      example:
        _id: 6730b1c4d3e5f6a7b8c9d0e1
        organizationId: 66a0f1e2d3c4b5a697887766
        name: Partners
        slug: partners
        description: Resellers and referral partners.
        type: custom
        objectType: partners
        icon: PiHandshake
        viewType: table
        kanbanConfig: { _id: 6730b1c4d3e5f6a7b8c9d0e2, lanes: [] }
        fields:
          - *exampleStageField
        agents: []
        permissions: *examplePermissions
        created: { at: "2026-11-04T09:30:00.000Z", by: 66a0f1e2d3c4b5a697881111 }
        updated: { at: "2026-11-04T09:31:00.000Z", by: 66a0f1e2d3c4b5a697881111 }
    errors:
      "403": "FORBIDDEN_ACTION: the object is private and you are not on its view list."
      "404": "NOT_FOUND: no object with this id in the workspace."

  createBaseSchemaField:
    summary: Create a field
    description: |
      Adds a field to an object (base schema). Every existing record gets an empty value for the new
      field. The response is the new field, not the whole object.


      `type.type` decides what records can store. Send the `type` object shown, as the web app does.
      Every type also accepts `""` or `null` as no value.

      | `type.type` | Records store | Send as `type` | Extra configuration |
      |---|---|---|---|
      | `text` | A string, trimmed. | `{"type":"text","enum":["text","richText"]}` | None |
      | `richText` | A string of formatted text. | `{"type":"richText","enum":["richText","text"]}` | None |
      | `number` | A number. | `{"type":"number","enum":["number"]}` | `settings.abbreviateNumber` |
      | `currency` | A number, the amount. | `{"type":"currency","enum":["number"]}` | `settings.currencyOptions`, `settings.abbreviateNumber` |
      | `rating` | A number. The web app shows 1 to 5 stars; the API does not limit it. | `{"type":"rating","enum":["number"]}` | None |
      | `checkbox` | `true` or `false`. | `{"type":"checkbox","enum":["boolean"]}` | None |
      | `date` | A date, sent as an ISO 8601 string. | `{"type":"date","enum":["date","timestamp"]}` | None |
      | `timestamp` | A date and time, sent as an ISO 8601 string. | `{"type":"timestamp","enum":["timestamp","date"]}` | None |
      | `select` | One string. | `{"type":"select","enum":["select"]}` | `settings.selectOptions` |
      | `multiSelect` | An array of strings. | `{"type":"multiSelect","enum":["multiSelect"]}` | `settings.selectOptions` |
      | `url` | A URL. Must parse as a URI. | `{"type":"url","enum":["text"]}` | None |
      | `email` | An email address. Must be valid. | `{"type":"email","enum":["text"]}` | None |
      | `phone` | A string. The format is not checked. | `{"type":"phone","enum":["text"]}` | None |
      | `user` | An array of workspace members. The web app stores `{ "id", "name", "email" }` per member, `id` being the user id. | `{"type":"user","enum":["user"]}` | None |
      | `image` | An object. | `{"type":"image","enum":["text"]}` | None |
      | `relationship` | Links to records of another object. | `{"type":"relationship","enum":["relationship"], ...}` | `type.relationshipSchemaId`, `type.relationshipConfig` |

      Record writes check a `select` value is a string and a `multiSelect` value is an array; they do
      not check them against `settings.selectOptions`. Relationship fields are best created in the web
      app, which sets up both sides of the link; this endpoint stores the configuration on this object
      only. `file` fields cannot be created through the API.


      With `isAIEnabled: true` and an `aiPrompt`, workers fill the field. Send `runImmediately: true`
      to start filling every record of the object straight away. That run uses credits for each
      record it processes.


      See Update a field for what can change after creation
      and what each change does to stored values.
    content: |
      <Warning>
      Pick a key (`name`) the object does not already use. The API does not refuse a duplicate key:
      the request succeeds without adding a field, and the existing field's value is cleared to an
      empty string on every record. Read the object's fields first.
      </Warning>
    parameters:
      id:
        description: The object's id.
        example: 6730b1c4d3e5f6a7b8c9d0e1
    requestBody:
      schema:
        type: object
        required: [name, type, permissions]
        properties:
          name:
            type: string
            minLength: 1
            maxLength: 100
            description: >-
              The field's key: what records use in `data` and filters name. 1 to 100 characters. Use
              lowercase letters, digits and underscores, starting with a letter, for example
              `partner_tier`. The API does not check the format yet, but keys with dots or `$`
              do not work in filters and updates, so avoid them. Must be new on the object (see the warning).
            example: partner_tier
          type: *fieldType
          displayName: *fieldDisplayName
          sequence:
            type: number
            description: >-
              The field's position, starting at 1. To append, send the highest `sequence` on the
              object plus 1, as the web app does. Stored as sent.
            example: 4
          icon: *fieldIcon
          description: *fieldDescription
          isAIEnabled: *fieldIsAIEnabled
          isHiddenField: *fieldIsHidden
          required: *fieldRequired
          unique: *fieldUnique
          aiPrompt: *fieldAiPrompt
          validation: *fieldValidation
          default:
            <<: *fieldDefault
            description: >-
              A default stored with the field. `value` must fit the field's type, or the request
              fails with 400. Records are not filled from it; use `settings.defaultValue` for that.
          settings: *fieldSettings
          permissions:
            <<: *fieldPermissions
            description: >-
              Required. Who may view and edit the field. With `organization`, every member who can see
              the object may. With `private`, only the listed roles and users. Send both `roles` and
              `users` in each list. The web app's default lists every role.
          runImmediately:
            type: boolean
            description: >-
              With `isAIEnabled: true`, starts a worker run now that fills this field on every record
              of the object. It uses credits for each record processed. Default false.
      examples:
        select:
          summary: A select field
          value:
            name: partner_tier
            displayName: Partner tier
            description: Commercial tier agreed in the partner contract.
            sequence: 4
            type: { type: select, enum: [select] }
            settings:
              selectOptions:
                - { value: Gold, color: amber }
                - { value: Silver, color: gray }
                - { value: Registered, color: blue }
            permissions: *examplePermissions
        currency:
          summary: A currency field
          value:
            name: contract_value
            displayName: Contract value
            sequence: 5
            type: { type: currency, enum: [number] }
            settings:
              currencyOptions: { currency: US, display: symbol }
              abbreviateNumber: true
            validation:
              rules:
                - { type: min, value: 0, message: Contract value cannot be negative. }
            permissions: *examplePermissions
        aiColumn:
          summary: An AI column
          value:
            name: partner_fit
            displayName: Partner fit
            sequence: 6
            type: { type: richText, enum: [richText, text] }
            isAIEnabled: true
            aiPrompt:
              prompt: Summarise how well this partner's customer base matches our ideal customer profile.
              variables: []
            permissions: *examplePermissions
            runImmediately: false
    response:
      status: 201
      description: The new field.
      message: Schema attribute added successfully
      specMismatch: The API answers with this status; the published spec still says 200.
      data: { $ref: "#/components/schemas/SchemaField" }
      example: *exampleStageField
    errors:
      "400": >-
        VALIDATION_FAILED: a required property is missing, `type.type` is not a supported type,
        `default.value` does not fit the type, `permissions` is incomplete, a `pattern` rule is
        unsafe, or the field could not be added.
      "403": "FORBIDDEN_ACTION: you may not edit this object."
      "404": "NOT_FOUND: no object with this id in the workspace."

  updateBaseSchemaField:
    summary: Update a field
    description: |
      Changes one field of an object (base schema). Send at least one property; properties you leave
      out are kept. Each property you send replaces the stored one completely: `settings`, `type`,
      `permissions`, `validation`, `aiPrompt` and `default` are not merged, so send the whole object.
      The response is the whole object with all of its fields.


      | Change | Effect on records |
      |---|---|
      | `displayName`, `description`, `icon`, `isHiddenField`, `unique` | Display only. |
      | `required`, `validation` | Apply to later record writes. Stored values are not re-checked. |
      | `settings.selectOptions` | Replaces the options. Records holding a removed option keep it. On a board's lane field, lanes are added and removed to match. |
      | `settings` (any key) | Replaces all settings: include the keys you want to keep. |
      | `sequence` | Moves the field to that position (starting at 1); the fields in between shift by one. |
      | `isAIEnabled` | Turns the AI column on or off and resets each record's AI status. Stored values are kept. |
      | `type` | Refused with 400 while any record of the object holds a value for the field, including the empty value every record gets when a field is added. When accepted, stored values are not converted. |
      | `name` (the key) | Values are not moved. See the warning. |
      | `permissions` | Replaces who may view and edit the field. |
    content: |
      <Warning>
      Changing `name` changes the field's key but leaves every record's value under the old key,
      where no field reads it, so the values stop showing. The API does not check that the new key is
      free either. Treat the key as fixed and change `displayName` instead.
      </Warning>
    parameters:
      id:
        description: The object's id.
        example: 6730b1c4d3e5f6a7b8c9d0e1
      fieldId:
        description: The field's `id`, from Get an object.
        example: 6730c2d5e4f6a7b8c9d0e1f2
    requestBody:
      schema:
        type: object
        minProperties: 1
        properties:
          name:
            type: string
            minLength: 1
            maxLength: 100
            description: A new key, 1 to 100 characters. Stored values are not moved (see the warning).
          type:
            <<: *fieldType
            description: >-
              A new type, replacing the current `type` object. Refused while records hold values for
              the field (see the table). Must be a type Heliyos knows, or the request fails with 400.
          displayName: *fieldDisplayName
          sequence:
            type: number
            description: >-
              A new position, 1 or more. The field moves there and the fields in between shift by one.
              Less than 1 is refused with 400.
          icon: *fieldIcon
          description: *fieldDescription
          isAIEnabled: *fieldIsAIEnabled
          isHiddenField: *fieldIsHidden
          required: *fieldRequired
          unique: *fieldUnique
          aiPrompt: *fieldAiPrompt
          validation: *fieldValidation
          default: *fieldDefault
          settings:
            <<: *fieldSettings
            description: >-
              Replaces all of the field's settings. Include every key you want to keep, for example the
              current `currencyOptions` when you change `abbreviateNumber`.
          permissions: *fieldPermissions
          runImmediately:
            type: boolean
            description: >-
              true starts a worker run now that fills this field on every record of the object, using
              credits for each record. It only runs when the field was already an AI column before this
              request; to turn on AI and run, send two requests. Default false.
      examples:
        relabel:
          summary: Rename the label
          value:
            displayName: Partner level
        options:
          summary: Replace the options
          value:
            settings:
              selectOptions:
                - { value: Gold, color: amber }
                - { value: Silver, color: gray }
                - { value: Bronze, color: orange }
                - { value: Registered, color: blue }
        move:
          summary: Move the field to position 2
          value:
            sequence: 2
    response:
      description: The whole object, with the updated field.
      message: Schema attribute updated successfully
      data: { $ref: "#/components/schemas/SchemaObject" }
      example:
        <<: *examplePartnersObject
        fields:
          - id: 6730b1c4d3e5f6a7b8c9d0e3
            sequence: 1
            name: partners
            displayName: Partners
            type: { type: text, enum: [text, longText, richText], relationshipConfig: [] }
            isAIEnabled: false
            isHiddenField: false
            required: false
            permissions: *examplePermissions
          - id: 6730c2d5e4f6a7b8c9d0e1f2
            sequence: 4
            name: partner_tier
            displayName: Partner level
            type: { type: select, enum: [select], relationshipConfig: [] }
            settings:
              selectOptions:
                - { value: Gold, color: amber }
                - { value: Silver, color: gray }
                - { value: Registered, color: blue }
            isAIEnabled: false
            isHiddenField: false
            required: false
            permissions: *examplePermissions
            metadata:
              created: { at: "2026-11-04T09:30:00.000Z", by: 66a0f1e2d3c4b5a697881111 }
              updated: { at: "2026-11-05T10:12:00.000Z", by: 66a0f1e2d3c4b5a697881111 }
    errors:
      "400": >-
        VALIDATION_FAILED: the body is empty or invalid, `sequence` is less than 1, the new type is
        unknown, records hold values for the field during a type change ("Cannot change field type"),
        or the field could not be updated. Nothing is written.
      "403": "FORBIDDEN_ACTION: you may not edit this field."
      "404": "NOT_FOUND: no object with this id in the workspace, or no field with this id on it."

  deleteBaseSchemaField:
    summary: Delete a field
    description: |
      Deletes one field of an object (base schema) and removes its value from every record,
      permanently.

      The API does not protect any field: built-in fields such as a company's `company_name`, the
      field a board's lanes come from, and relationship fields are deleted like any other. Deleting a
      relationship field leaves the matching field on the other object unchanged.
    content: |
      <Warning>
      This removes the field and its value on every record of the object. It cannot be undone.
      </Warning>
    parameters:
      id:
        description: The object's id.
        example: 6730b1c4d3e5f6a7b8c9d0e1
      fieldId:
        description: The field's `id`, from Get an object.
        example: 6730c2d5e4f6a7b8c9d0e1f2
    response:
      description: The field and its values were deleted. `data` is an empty object.
      message: Schema attribute deleted successfully
      empty: true
    errors:
      "403": "FORBIDDEN_ACTION: you may not edit this field."
      "404": "NOT_FOUND: no object with this id in the workspace, or no field with this id on it."
