tag:
  name: Schemas
  icon: /icons/app-objects.svg
  order: 20
  description: >-
    Objects are your record types: companies, people, deal pipelines and any custom objects you add.
    Each object has fields, and a field's type decides what its records can hold.

components:
  SchemaObject:
    type: object
    description: An object (base schema) and its fields.
    properties:
      id:
        allOf: [{ $ref: "#/components/schemas/ObjectId" }]
        description: >-
          The object's id. Records name it as their `schemaId`. List, create and update return it as
          `id`; get returns it as `_id`.
      _id:
        allOf: [{ $ref: "#/components/schemas/ObjectId" }]
        description: The object's id, as returned by get.
      organizationId:
        allOf: [{ $ref: "#/components/schemas/ObjectId" }]
        description: The workspace the object belongs to.
      name:
        type: string
        description: The display name, for example `Partners`. Unique in the workspace.
      slug:
        type: string
        description: A short URL-safe name, unique in the workspace, used in web app links.
      description:
        type: string
        description: What the object holds.
      type:
        type: string
        enum: [base, computed, custom]
        description: >-
          The object's kind. `base` for the built-in objects (companies, people and deal pipelines),
          `custom` for objects you create. `computed` is accepted but not used by Heliyos.
      objectType:
        type: string
        description: >-
          The record type records of this object carry: `company`, `people` and `deals` for the
          built-in objects. For a custom object it is derived from the name when the object is
          created (lowercase, spaces replaced by underscores, plus a 4-digit suffix if it is already
          taken) and never changes afterwards.
        example: partners
      icon:
        type: string
        description: The icon name the web app shows for the object.
      iconColor:
        type: string
        description: A label colour family for the icon, for example `blue`.
      viewType:
        type: string
        enum: [table, kanban]
        description: How the web app shows the object by default. Deal pipelines use `kanban`.
      kanbanConfig:
        $ref: "#/components/schemas/SchemaKanbanConfig"
      fields:
        type: array
        description: >-
          The object's fields that you may view, in storage order. Sort by `sequence` for display
          order. Fields whose permissions hide them from you are left out.
        items: { $ref: "#/components/schemas/SchemaField" }
      permissions:
        $ref: "#/components/schemas/SchemaPermissions"
      agents:
        type: array
        description: Reserved for internal use.
        items: { type: object, additionalProperties: true }
      recordCount:
        type: integer
        description: >-
          How many records the object has. Only in a list sent with `isRecordCount=true`.
      created:
        type: object
        description: When the object was created, and by whom.
        properties:
          at: { $ref: "#/components/schemas/Timestamp" }
          by: { type: string, description: "Id of the user who created it, or `system` for built-in objects." }
      updated:
        type: object
        description: When the object was last changed, and by whom.
        properties:
          at: { $ref: "#/components/schemas/Timestamp" }
          by: { type: string, description: Id of the user who last changed it. }

  SchemaKanbanConfig:
    type: object
    description: >-
      The board layout. Each lane is one option of the lane field. Lanes are managed in the web app;
      changing the lane field's `settings.selectOptions` adds and removes lanes to match.
    properties:
      _id: { $ref: "#/components/schemas/ObjectId" }
      laneField:
        type: string
        description: The key of the select field whose options are the lanes, for example `stage`.
      lanes:
        type: array
        description: The board's lanes.
        items:
          type: object
          properties:
            _id: { $ref: "#/components/schemas/ObjectId" }
            name: { type: string, description: "The lane's name, equal to one option of the lane field." }
            order: { type: number, description: The lane's position on the board. }
            color: { type: string, description: "A label colour family, for example `green`." }
            icon: { type: string, description: An optional icon name. }
            isVisible: { type: boolean, description: "false when the lane is hidden on the board." }

  SchemaPermissions:
    type: object
    description: >-
      Who may view and edit. With `organization`, every member may. With `private`, only the roles and
      users listed (and the creator). API keys act with the `ADMIN` role.
    properties:
      visibility:
        type: string
        description: "`organization` or `private`. Objects also store `public`, which behaves like an allow list of roles and users."
      editableBy:
        type: object
        description: Who may edit when `visibility` is `private`.
        properties:
          roles:
            type: array
            items: { type: string }
            description: "Role names: `OWNER`, `ADMIN`, `MEMBER`, `STAFF`, `SUPPORT`, `SUPER_ADMIN`, `AGENCY`."
          users:
            type: array
            items: { $ref: "#/components/schemas/ObjectId" }
            description: User ids.
      viewableBy:
        type: object
        description: Who may view when `visibility` is `private`.
        properties:
          roles:
            type: array
            items: { type: string }
            description: Role names, as in `editableBy`.
          users:
            type: array
            items: { $ref: "#/components/schemas/ObjectId" }
            description: User ids.

  SchemaFieldType:
    type: object
    description: The field's type. See the field types table on Create a field.
    properties:
      type:
        type: string
        enum: [text, richText, number, currency, rating, checkbox, date, timestamp, select, multiSelect, url, email, phone, user, image, relationship, file]
        description: >-
          What the field holds. `file` exists on some fields but cannot be created through the API.
      enum:
        type: array
        items: { type: string }
        description: >-
          Related kinds the web app uses for the field's editors, for example `["text", "richText"]`.
          A list containing `multiSelect` or `array` makes CSV import split values on commas.
      relationshipSchemaId:
        type: string
        description: "`relationship` fields: id of the object the field links to."
      relationshipConfig:
        type: array
        description: "`relationship` fields: how the link maps onto the other object."
        items:
          type: object
          properties:
            targetSchema: { type: string, description: Id of the linked object. }
            associatedField: { type: string, description: Key of the matching field on the linked object. }
            inverseName: { type: string, description: Key of this side of the link. }
            onDelete:
              type: string
              enum: [cascade, setNull, restrict]
              description: What the link should do when the linked record is deleted. Defaults to `setNull`.

  SchemaFieldSettings:
    type: object
    description: Type-specific configuration.
    properties:
      selectOptions:
        type: array
        description: >-
          `select` and `multiSelect`: the choices, in order. Each is `{ "value", "color" }` (a label
          colour family) or a bare string.
        items:
          oneOf:
            - type: string
            - type: object
              properties:
                value: { type: string, description: "The option's text, which is what records store." }
                color: { type: string, description: "A label colour family: `red`, `orange`, `amber`, `olive`, `green`, `teal`, `blue`, `purple`, `pink` or `gray`." }
      currencyOptions:
        type: object
        description: "`currency`: how the web app formats amounts."
        properties:
          currency: { type: string, description: "A two-letter country code whose currency is used, for example `US` for US dollars or `DE` for euros." }
          display: { type: string, description: "`symbol` ($1,200), `code` (USD 1,200) or `name` (1,200 US Dollar)." }
      abbreviateNumber:
        type: boolean
        description: "`number` and `currency`: show large values as 1.2k, 3.4M and so on."
      defaultValue:
        description: >-
          The value a new record gets when it is created without one (missing, null or an empty
          string). Must fit the field's type.
      aiRunStatus:
        type: string
        enum: [RUNNING, PENDING, FINISHED, ERROR, ""]
        description: A display status for an AI column, set by the web app. Heliyos does not update it.

  SchemaField:
    type: object
    description: One field of an object.
    properties:
      id:
        type: string
        pattern: "^[0-9a-fA-F]{24}$"
        description: The field's id. Use it as `fieldId` to change or delete the field.
        example: 6730c2d5e4f6a7b8c9d0e1f2
      _id:
        type: string
        description: An internal id some responses include. Address the field by `id`.
      name:
        type: string
        description: The field's key, which records use in `data` and filters name, for example `contract_value`.
      displayName:
        type: string
        description: The label shown in the web app.
      description:
        type: string
        description: What the field holds. Shown in the web app and read by workers.
      icon:
        type: string
        description: The icon name the web app shows next to the label.
      sequence:
        type: number
        description: The field's position in the object, starting at 1.
      type: { $ref: "#/components/schemas/SchemaFieldType" }
      settings: { $ref: "#/components/schemas/SchemaFieldSettings" }
      isAIEnabled:
        type: boolean
        description: "true when workers fill the field from `aiPrompt` (an AI column)."
      aiPrompt:
        type: object
        nullable: true
        description: The AI column's prompt.
        properties:
          prompt: { type: string, description: The instructions workers follow to fill the field. }
          variables: { type: array, items: { type: string }, description: Names of the fields the prompt mentions. }
      isHiddenField:
        type: boolean
        description: "true when the field is hidden from table views by default."
      isVisibleOnlyInPage:
        type: boolean
        description: "true when the field shows only on the record page, not in tables."
      isReadOnly:
        type: boolean
        description: "true when the web app shows the field as read-only. The API does not enforce it."
      required:
        type: boolean
        description: "true when creating a record without this key fails."
      unique:
        type: boolean
        description: Shown in the web app. The API does not enforce uniqueness on record writes.
      validation:
        type: object
        description: Rules checked when a record is written.
        properties:
          rules:
            type: array
            items:
              type: object
              properties:
                type: { type: string, description: The rule. See `validation` on Create a field. }
                value: { description: The rule's argument. }
                message: { type: string, description: A message for people editing the record. }
      default:
        type: object
        description: A stored default. Records are not filled from it; `settings.defaultValue` does that.
        properties:
          type: { type: string, enum: [static, dynamic] }
          value: { description: The default value. }
      permissions: { $ref: "#/components/schemas/SchemaPermissions" }
      hasAccess:
        type: boolean
        description: Present in lists. Always true, because fields you may not view are left out.
      metadata: { $ref: "#/components/schemas/AuditMetadata" }

x-field-body:
  type: &fieldType
    type: object
    required: [type]
    description: >-
      The field's type. `type.type` is required; send the rest as the web app does (see the field
      types table).
    properties:
      type:
        type: string
        enum: [text, richText, number, currency, rating, checkbox, date, timestamp, select, multiSelect, url, email, phone, user, image, relationship]
        description: The field type. Any other value is refused with 400.
      enum:
        type: array
        items: { type: string }
        description: >-
          Related kinds for the web app's editors, for example `["text", "richText"]` for `text`.
          Send the value in the field types table.
      relationshipSchemaId:
        type: string
        description: "`relationship` only: id of the object to link to."
      relationshipConfig:
        type: array
        description: >-
          `relationship` only: how the link maps onto the other object. Stored on this object only;
          the matching field on the other object is not created or changed.
        items:
          type: object
          required: [targetSchema, associatedField, inverseName]
          additionalProperties: false
          properties:
            targetSchema: { type: string, description: Id of the linked object. }
            associatedField: { type: string, description: Key of the matching field on the linked object. }
            inverseName: { type: string, description: Key of this side of the link. }
            onDelete:
              type: string
              enum: [cascade, setNull, restrict]
              description: What the link should do when the linked record is deleted. Defaults to `setNull`.
  displayName: &fieldDisplayName
    type: string
    description: The label shown in the web app, for example `Contract value`. May be empty.
  icon: &fieldIcon
    type: string
    description: An icon name from the web app's icon set.
  description: &fieldDescription
    type: string
    description: What the field holds. Shown in the web app and read by workers.
  isAIEnabled: &fieldIsAIEnabled
    type: boolean
    description: >-
      true makes the field an AI column that workers fill from `aiPrompt`. The web app offers it for
      `text`, `richText`, `number`, `date`, `select`, `multiSelect` and `checkbox`. Turning it on or
      off resets each record's AI status for the field; stored values are kept.
  isHiddenField: &fieldIsHidden
    type: boolean
    description: true hides the field from table views by default. Default false.
  required: &fieldRequired
    type: boolean
    description: >-
      true makes creating a record without this key fail with 400. An empty string or null still
      counts as a value, and record updates are not checked. Default false.
  unique: &fieldUnique
    type: boolean
    description: Shown in the web app. The API does not enforce uniqueness on record writes. Default false.
  aiPrompt: &fieldAiPrompt
    type: object
    additionalProperties: false
    description: The AI column's prompt.
    properties:
      prompt: { type: string, description: The instructions workers follow to fill the field. }
      variables:
        type: array
        items: { type: string }
        description: Names of the fields the prompt mentions. Send `[]` when it mentions none.
  validation: &fieldValidation
    type: object
    additionalProperties: false
    description: >-
      Rules checked whenever a record writes this field. Values already stored are not re-checked.
    properties:
      rules:
        type: array
        maxItems: 20
        description: |
          Up to 20 rules, each `{ "type", "value", "message" }`. Rule types:
          - `minLength`, `maxLength`: string length, `value` a number.
          - `pattern`: a regular expression the value must match, `value` a string of at most 200
            characters. A pattern that is invalid or could take exponential time (nested repetition
            such as `(a+)+`) is refused with 400.
          - `email`: the value must be an email address (`value` is ignored).
          - `min`, `max`: number bounds, `value` a number.

          Other rule types are stored but not checked. Use string rules on text-like types and `min`
          and `max` on number types.
        items:
          type: object
          required: [type, value, message]
          additionalProperties: false
          properties:
            type: { type: string, description: "`minLength`, `maxLength`, `pattern`, `email`, `min` or `max`." }
            value: { description: The rule's argument. }
            message: { type: string, description: A message for people editing the record. }
  default: &fieldDefault
    type: object
    required: [type, value]
    additionalProperties: false
    description: >-
      A default stored with the field. Records are not filled from it; use `settings.defaultValue`
      for that.
    properties:
      type: { type: string, enum: [static, dynamic], description: "`static` or `dynamic`." }
      value: { description: The default value. }
  settings: &fieldSettings
    type: object
    additionalProperties: false
    description: Type-specific configuration. See the field types table for which keys apply.
    properties:
      selectOptions:
        type: array
        description: >-
          `select` and `multiSelect`: the choices, in order. Each is `{ "value", "color" }` or a bare
          string. Colours are label families: `red`, `orange`, `amber`, `olive`, `green`, `teal`,
          `blue`, `purple`, `pink`, `gray`. Values are stored as sent; keep them unique.
        items:
          oneOf:
            - type: string
            - type: object
              required: [value, color]
              additionalProperties: false
              properties:
                value: { type: string, description: "The option's text, which is what records store." }
                color: { type: string, description: A label colour family. }
      currencyOptions:
        type: object
        additionalProperties: false
        description: "`currency`: how the web app formats amounts."
        properties:
          currency: { type: string, description: "A two-letter country code whose currency is used, for example `US` for US dollars." }
          display: { type: string, description: "`symbol`, `code` or `name`." }
      defaultValue:
        description: >-
          The value a new record gets when it is created without one (missing, null or an empty
          string). Must fit the field's type, or record creation fails.
      aiRunStatus:
        type: string
        enum: [RUNNING, PENDING, FINISHED, ERROR, ""]
        description: A display status for an AI column. The web app sends `PENDING` when it saves an AI column without running it.
      abbreviateNumber:
        type: boolean
        description: "`number` and `currency`: show large values as 1.2k, 3.4M and so on."
  permissions: &fieldPermissions
    type: object
    required: [visibility, editableBy, viewableBy]
    additionalProperties: false
    description: >-
      Who may view and edit the field. With `organization`, every member who can see the object may.
      With `private`, only the listed roles and users. Send both `roles` and `users` in each list.
    properties:
      visibility:
        type: string
        enum: [private, organization]
        description: "`organization` or `private`."
      editableBy:
        type: object
        additionalProperties: false
        description: Who may edit the field when it is private.
        properties:
          roles:
            type: array
            items: { type: string }
            description: "Role names: `OWNER`, `ADMIN`, `MEMBER`, `STAFF`, `SUPPORT`, `SUPER_ADMIN`, `AGENCY`."
          users: { type: array, items: { type: string }, description: User ids. }
      viewableBy:
        type: object
        additionalProperties: false
        description: Who may view the field when it is private.
        properties:
          roles: { type: array, items: { type: string }, description: "Role names, as in `editableBy`." }
          users: { type: array, items: { type: string }, description: User ids. }

